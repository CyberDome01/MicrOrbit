<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicrOrbit · Agents Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07090f; --bg2:#0c0f1a; --bg3:#111827; --sur:#151d2e; --sur2:#1a2438;
  --gold:#c4a050; --gold2:#e8c878; --gold3:#f5d998;
  --green:#10b981; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6;
  --purple:#a78bfa; --cyan:#22d3ee;
  --t1:#f0ece4; --t2:#b8b0a0; --t3:#6b7280;
  --bd:rgba(196,160,80,.12); --bd2:rgba(196,160,80,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--t1);font-family:'Outfit',sans-serif;height:100%;overflow:hidden}

/* TOPBAR */
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0;z-index:50;position:relative}
.topbar-logo{display:flex;align-items:center;gap:8px}
.topbar-title{font-size:.72rem;font-weight:600;letter-spacing:.12em;color:var(--gold)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{background:rgba(196,160,80,.1);border:1px solid var(--bd2);border-radius:20px;padding:3px 10px;font-size:.62rem;font-weight:700;letter-spacing:.08em;color:var(--gold)}
.badge-live{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);border-radius:20px;padding:3px 10px;font-size:.62rem;font-weight:700;color:#10b981;display:flex;align-items:center;gap:5px}
.badge-live::before{content:'';width:5px;height:5px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-back{background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;font-family:inherit;font-size:.7rem;font-weight:500;color:var(--t2);cursor:pointer;transition:all .2s;text-decoration:none}
.btn-back:hover{border-color:var(--gold);color:var(--gold)}
.api-indicator{display:flex;align-items:center;gap:5px;background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:.63rem;cursor:pointer;transition:all .2s}
.api-indicator:hover{border-color:var(--gold)}
.api-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.api-dot.warn{background:var(--amber)}
.api-dot.error{background:var(--red)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 52px)}

/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:12px 14px 8px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sidebar-head-label{font-size:.6rem;font-weight:700;letter-spacing:.12em;color:var(--t3);text-transform:uppercase;margin-bottom:8px}
.agent-list{flex:1;overflow-y:auto;padding:6px}
.agent-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:all .15s;margin-bottom:2px;position:relative}
.agent-item:hover{background:var(--sur)}
.agent-item.active{background:var(--sur);border-left:2px solid var(--gold);padding-left:8px}
.agent-item.supervisor.active{border-left-color:var(--purple)}
.agent-avatar{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0;font-family:'DM Mono',monospace;letter-spacing:.5px}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:.75rem;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-role{font-size:.6rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-status{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.agent-status.ready{background:var(--green)}
.agent-status.config{background:var(--amber)}
.sidebar-section{padding:4px 10px 2px;font-size:.58rem;font-weight:700;letter-spacing:.12em;color:var(--t3);text-transform:uppercase;margin-top:4px}

.sidebar-bottom{border-top:1px solid var(--bd);padding:8px 6px;flex-shrink:0}
.sidebar-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:.72rem;color:var(--t2);transition:all .15s;width:100%}
.sidebar-btn:hover{background:var(--sur);color:var(--t1)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* AGENT HEADER */
.agent-header{padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-shrink:0}
.agent-header-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;font-family:'DM Mono',monospace}
.agent-header-info{flex:1}
.agent-header-name{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--t1)}
.agent-header-desc{font-size:.68rem;color:var(--t3)}
.agent-header-actions{display:flex;gap:6px}
.btn-sm{background:var(--sur);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-family:inherit;font-size:.65rem;font-weight:600;color:var(--t2);cursor:pointer;transition:all .15s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm.active{background:rgba(196,160,80,.1);border-color:var(--gold);color:var(--gold)}

/* CHAT */
.chat-area{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--sur2);border-radius:2px}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;gap:14px;flex:1}
.welcome-icon{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:4px}
.welcome h2{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--t1);line-height:1.3}
.welcome p{font-size:.78rem;color:var(--t3);max-width:460px;line-height:1.7}
.prompt-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;max-width:560px;margin-top:8px}
.prompt-chip{background:var(--sur);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;font-size:.72rem;color:var(--t2);cursor:pointer;text-align:left;transition:all .18s;line-height:1.5}
.prompt-chip:hover{border-color:var(--gold);color:var(--t1);background:var(--sur2)}
.prompt-chip strong{display:block;font-size:.62rem;letter-spacing:.05em;margin-bottom:2px}

/* Messages */
.msg{display:flex;gap:10px;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;flex-shrink:0}
.msg.user .msg-av{background:var(--gold);color:#080c12}
.msg.agent .msg-av{background:linear-gradient(135deg,#1a2438,#0c1524);border:1px solid var(--bd2);font-size:.55rem}
.msg-bubble{max-width:78%;padding:10px 13px;border-radius:12px;font-size:.79rem;line-height:1.72}
.msg.user .msg-bubble{background:rgba(196,160,80,.1);border:1px solid rgba(196,160,80,.2);color:var(--t1);border-radius:12px 3px 12px 12px}
.msg.agent .msg-bubble{background:var(--sur);border:1px solid var(--bd);color:var(--t1);border-radius:3px 12px 12px 12px;white-space:pre-wrap}

/* Output card */
.output-card{background:var(--bg2);border:1px solid var(--bd2);border-radius:11px;overflow:hidden;margin-top:6px}
.output-card-head{background:rgba(196,160,80,.06);border-bottom:1px solid var(--bd);padding:8px 13px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px}
.output-card-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.output-card-actions{display:flex;gap:5px}
.output-card-body{padding:13px 15px;font-family:'DM Mono',monospace;font-size:.71rem;line-height:1.8;color:var(--t1);white-space:pre-wrap;max-height:380px;overflow-y:auto}

/* Supervisor routing card */
.routing-card{background:var(--bg2);border:1px solid rgba(167,139,250,.25);border-radius:11px;overflow:hidden;margin-top:6px}
.routing-card-head{background:rgba(167,139,250,.06);border-bottom:1px solid rgba(167,139,250,.15);padding:8px 13px;display:flex;align-items:center;justify-content:space-between}
.routing-card-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--purple);text-transform:uppercase}
.routing-flow{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:10px 13px;border-bottom:1px solid var(--bd)}
.routing-node{background:var(--sur);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:.65rem;font-weight:600;color:var(--t2)}
.routing-node.active{border-color:var(--purple);color:var(--purple);background:rgba(167,139,250,.08)}
.routing-node.done{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.06)}
.routing-arrow{color:var(--t3);font-size:.8rem}
.confidence-bar{padding:10px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.conf-label{font-size:.63rem;color:var(--t3);font-family:'DM Mono',monospace;flex-shrink:0}
.conf-track{flex:1;height:4px;background:var(--sur2);border-radius:2px;overflow:hidden}
.conf-fill{height:100%;border-radius:2px;transition:width .5s ease}
.conf-score{font-size:.68rem;font-weight:700;font-family:'DM Mono',monospace}

/* Thinking */
.thinking{display:flex;gap:10px;align-items:flex-start}
.thinking-bubble{background:var(--sur);border:1px solid var(--bd);border-radius:3px 12px 12px 12px;padding:10px 14px;display:flex;align-items:center;gap:7px;font-size:.73rem;color:var(--t3)}
.dots span{width:4px;height:4px;background:var(--gold);border-radius:50%;display:inline-block;margin:0 2px;animation:tdot 1.4s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* INPUT */
.input-area{border-top:1px solid var(--bd);padding:12px 16px;background:var(--bg2);flex-shrink:0}
.input-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.format-select{background:var(--sur);border:1px solid var(--bd);border-radius:7px;padding:4px 8px;font-family:inherit;font-size:.68rem;color:var(--t1);cursor:pointer;outline:none}
.format-select:focus{border-color:var(--gold)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-box{flex:1;background:var(--sur);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.8rem;color:var(--t1);resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.5;transition:border-color .2s}
.input-box::placeholder{color:var(--t3)}
.input-box:focus{border-color:var(--bd2)}
.btn-send{background:linear-gradient(135deg,var(--gold),#a07830);border:none;border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .2s;flex-shrink:0}
.btn-send:hover{opacity:.85}
.btn-send:disabled{opacity:.4;cursor:not-allowed}

/* SETTINGS PANEL */
.settings-panel{flex:1;overflow-y:auto;padding:20px 22px;display:none}
.settings-panel.active{display:block}
.settings-section{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.settings-section h3{font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.setting-group{margin-bottom:12px}
.setting-label{font-size:.63rem;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.setting-input{background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;font-family:inherit;font-size:.78rem;color:var(--t1);outline:none;width:100%;transition:border-color .2s}
.setting-input:focus{border-color:var(--bd2)}
.setting-select{background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;font-family:inherit;font-size:.78rem;color:var(--t1);outline:none;width:100%;cursor:pointer}
.setting-select option{background:var(--bg3)}
.setting-textarea{background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;font-family:'DM Mono',monospace;font-size:.72rem;color:var(--t1);outline:none;width:100%;resize:vertical;min-height:80px;transition:border-color .2s}
.setting-textarea:focus{border-color:var(--bd2)}

/* Provider cards */
.provider-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.provider-card{background:var(--sur);border:1px solid var(--bd);border-radius:9px;padding:12px;cursor:pointer;transition:all .15s;text-align:center}
.provider-card:hover{border-color:var(--bd2)}
.provider-card.active{border-color:var(--gold);background:rgba(196,160,80,.06)}
.provider-icon{font-size:1.4rem;margin-bottom:5px}
.provider-name{font-size:.72rem;font-weight:700;color:var(--t1)}
.provider-model{font-size:.62rem;color:var(--t3);margin-top:2px}

/* Upload zone */
.upload-zone{border:2px dashed var(--bd2);border-radius:9px;padding:18px;text-align:center;cursor:pointer;transition:border-color .2s;position:relative;margin-bottom:8px}
.upload-zone:hover{border-color:var(--gold)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone p{font-size:.75rem;color:var(--t3);margin-top:5px}
.upload-zone span{font-size:.64rem;color:var(--t3)}
.file-pill{background:rgba(196,160,80,.08);border:1px solid var(--bd2);border-radius:7px;padding:5px 10px;font-size:.68rem;color:var(--gold);display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}

/* Connection test */
.test-result{padding:8px 12px;border-radius:7px;font-size:.72rem;margin-top:8px;display:none}
.test-result.success{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:var(--green)}
.test-result.error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red)}

/* Audit trail */
.audit-trail{padding:10px 0;max-height:200px;overflow-y:auto}
.audit-entry{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid rgba(196,160,80,.05);font-size:.65rem}
.audit-entry:last-child{border-bottom:none}
.audit-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:4px}
.audit-dot.g{background:var(--green)}
.audit-dot.p{background:var(--purple)}
.audit-dot.b{background:var(--blue)}
.audit-text{color:var(--t2);flex:1;line-height:1.5}
.audit-time{color:var(--t3);font-family:'DM Mono',monospace;flex-shrink:0}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--sur2);border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-size:.75rem;color:var(--t1);z-index:200;animation:toastIn .3s ease;max-width:280px}
.toast.success{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}
.toast.warning{border-color:rgba(245,158,11,.3)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--sur2);border-radius:2px}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <svg width="22" height="22" viewBox="0 0 36 36" fill="none">
      <style>.oha{animation:sha 4s linear infinite;transform-origin:18px 18px}.ohb{animation:shb 6s linear infinite reverse;transform-origin:18px 18px}@keyframes sha{to{transform:rotate(360deg)}}@keyframes shb{to{transform:rotate(360deg)}}</style>

</div>

<div id="settings-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center">
  <div style="background:var(--bg2);border:1px solid var(--bd2);border-radius:16px;width:min(580px,95vw);max-height:88vh;overflow-y:auto;padding:22px;position:relative">
    <div style="position:absolute;top:14px;right:14px;cursor:pointer;background:var(--sur);border:1px solid var(--bd);border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--t2)" onclick="closeSettings()">✕</div>
    <div id="settings-content"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════

let globalSettings = JSON.parse(localStorage.getItem('mo_global_settings') || '{"provider":"claude","model":"claude-sonnet-4-20250514","apiKey":"","azureEndpoint":"","azureDeployment":""}');

// ═══════════════════════════════════════════════════════════
// AGENT DEFINITIONS (RICECO)
// ═══════════════════════════════════════════════════════════
const AGENTS = [
  {
    id: 'supervisor',
    name: 'Supervisor',
    fullName: 'Supervisor Agent',
    role: 'Orchestrator',

    prompts: [
      { label: 'MULTI-AGENT TASK', text: 'Describe a task and I will route it to the right agents automatically' },

      { label: 'RISK ASSESSMENT', text: 'I need a risk assessment — route to the appropriate analyst agents' },
      { label: 'EXECUTIVE SUMMARY', text: 'Summarize a complex topic into an executive-ready briefing' },
    ],
    systemPrompt: `You are the Supervisor Agent — the central orchestrator for the MicrOrbit Agents Hub, a multi-agent system for the Government of Alberta.

ROLE: Act as a senior Chief of Staff / AI Orchestrator. Interpret user requests, decompose tasks, select the right specialized agents, and synthesize outputs into a unified executive-ready response.

AVAILABLE AGENTS:
- Executive Assistant: scheduling, coordination, communication drafting
- Policy Analyst: policy analysis, legislation review, evidence-based recommendations
- Briefing Specialist: briefing notes, technical documents, executive summaries
- Business Analyst: requirements, process mapping, stakeholder analysis
- AR Routing Agent: ARTS Action Request lifecycle, routing, GOA email drafting
- Policy Advisor (Electricity): Alberta electricity systems, AESO, AUC, Bill 95, REM

- Cybersecurity Analyst: threat detection, incident response, security frameworks

ORCHESTRATION LOGIC:
1. Classify the request
2. Identify which agent(s) to involve
3. If multi-agent: explain the flow (e.g. Policy Analyst → Briefing Specialist → Executive Assistant)
4. Provide a synthesized, executive-ready response
5. Always include a confidence score (0-100) at the end

OUTPUT FORMAT:
Always structure your response as:
ROUTING: [which agents were involved]
FLOW: [if multi-agent, show the chain]

[Main synthesized response]

CONFIDENCE: [score]/100 — [brief reason]

  },
  {
    id: 'executive-assistant',
    name: 'Executive Assistant',
    fullName: 'Executive Assistant Agent',

    color: '#e8c878',
    bg: 'rgba(232,200,120,.12)',
    border: 'rgba(232,200,120,.3)',
    icon: '👔',

// ═══════════════════════════════════════════════════════════
// UNIVERSAL AI CALLER
// ═══════════════════════════════════════════════════════════
async function callAI(userMessage, systemPrompt, conversationHistory = []) {
  const { provider, model, apiKey, azureEndpoint, azureDeployment } = globalSettings;
  if (!apiKey) { showToast('No API key configured — open Settings', 'warning'); return null; }

  try {
    if (provider === 'claude') {
      const messages = conversationHistory.length > 0
        ? conversationHistory.concat([{role:'user', content:userMessage}])
        : [{role:'user', content:userMessage}];
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {'Content-Type':'application/json','anthropic-version':'2023-06-01'},
        body: JSON.stringify({ model, max_tokens: 3000, system: systemPrompt, messages })
      });
      const d = await r.json();
      return d.content?.[0]?.text || null;

    } else if (provider === 'openai') {
      const messages = [{role:'system', content:systemPrompt}]
        .concat(conversationHistory)
        .concat([{role:'user', content:userMessage}]);
      const r = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
        body: JSON.stringify({ model, max_tokens: 3000, messages })
      });
      const d = await r.json();
      return d.choices?.[0]?.message?.content || null;

    } else if (provider === 'gemini') {
      const contents = conversationHistory.map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{text: m.content}]
      })).concat([{role:'user', parts:[{text:userMessage}]}]);
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ systemInstruction: {parts:[{text:systemPrompt}]}, contents })
      });
      const d = await r.json();
      return d.candidates?.[0]?.content?.parts?.[0]?.text || null;

    } else if (provider === 'azure') {
      const endpoint = azureEndpoint || 'https://your-resource.openai.azure.com';
      const deployment = azureDeployment || model;
      const messages = [{role:'system', content:systemPrompt}]
        .concat(conversationHistory)
        .concat([{role:'user', content:userMessage}]);
      const r = await fetch(`${endpoint}/openai/deployments/${deployment}/chat/completions?api-version=2024-08-01-preview`, {
        method: 'POST',
        headers: {'Content-Type':'application/json','api-key':apiKey},
        body: JSON.stringify({ max_tokens: 3000, messages })
      });
      const d = await r.json();
      return d.choices?.[0]?.message?.content || null;
    }
  } catch(e) {
    showToast('API error: ' + e.message, 'warning');
    return null;
  }
}

// BUILD SYSTEM PROMPT (base + uploaded JD)
// ═══════════════════════════════════════════════════════════
function buildSystemPrompt(agent) {
  const settings = agentSettings[agent.id] || {};
  let prompt = agent.systemPrompt;
  if (settings.jdText) prompt += `\n\n═══ JOB DESCRIPTION / EXPERTISE PROFILE ═══\n${settings.jdText.substring(0,4000)}`;
  if (settings.policiesText) prompt += `\n\n═══ POLICIES & CONSTRAINTS ═══\n${settings.policiesText.substring(0,3000)}`;
  if (settings.examplesText) prompt += `\n\n═══ EXAMPLE OUTPUTS (match this style/tone) ═══\n${settings.examplesText.substring(0,2000)}`;
  if (settings.customInstructions) prompt += `\n\n═══ CUSTOM INSTRUCTIONS ═══\n${settings.customInstructions}`;
  return prompt;
}

// RENDER SIDEBAR
// ═══════════════════════════════════════════════════════════
function renderSidebar() {
  const list = document.getElementById('agent-list');
  const supervisor = AGENTS.filter(a => a.isSupervisor);
  const regular = AGENTS.filter(a => !a.isSupervisor);

  let html = '<div class="sidebar-section">Command</div>';
  html += supervisor.map(a => agentItem(a)).join('');
  html += '<div class="sidebar-section" style="margin-top:8px">Agents</div>';
  html += regular.map(a => agentItem(a)).join('');
  list.innerHTML = html;

function agentItem(a) {
  const settings = agentSettings[a.id] || {};
  const hasJD = !!settings.jdText;
  const isActive = currentAgentId === a.id;
  return `<div class="agent-item ${isActive?'active':''} ${a.isSupervisor?'supervisor':''}" onclick="selectAgent('${a.id}')">
    <div class="agent-avatar" style="background:${a.bg};border:1px solid ${a.border};color:${a.color}">${a.abbr}</div>

}

  const input = document.getElementById('chat-input');
  const text = input?.value?.trim();
  if (!text) return;

  const agent = AGENTS.find(a => a.id === currentAgentId);
  if (!agent) return;

  const btn = document.getElementById('send-btn');
  if (btn) btn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  // Init session
  if (!agentSessions[agent.id]) agentSessions[agent.id] = [];
  agentSessions[agent.id].push({ role: 'user', content: text });

  // Add format instruction if not supervisor
  let userContent = text;
  const fmtSelect = document.getElementById('fmt-select');
  if (fmtSelect && fmtSelect.value !== 'auto' && fmtSelect.value !== 'raw') {
    const fmtMap = {
      briefing_note: 'Format your response as a GOA Briefing Note (ISSUE, BACKGROUND, CURRENT SITUATION, OPTIONS, RECOMMENDATION, FINANCIAL IMPLICATIONS, COMMUNICATIONS CONSIDERATIONS).',
      options_paper: 'Format as a Policy Options Paper with 3 options, pros/cons, and a preferred recommendation.',
      analysis: 'Provide a detailed structured analysis with clear sections.',
      memo: 'Format as a concise internal GOA memo.'
    };
    if (fmtMap[fmtSelect.value]) userContent += '\n\n[FORMAT: ' + fmtMap[fmtSelect.value] + ']';
  }

  renderMainArea();
  scrollChat();

  // Show thinking
  addThinking(agent);

  addAudit(`${agent.name} received query`, agent.isSupervisor ? 'p' : 'b');

  // Build conversation history (last 8 turns)
  const history = agentSessions[agent.id].slice(-9, -1).map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.content
  }));

  const systemPrompt = buildSystemPrompt(agent);
  const reply = await callAI(userContent, systemPrompt, history);

  removeThinking();

  if (reply) {
    if (agent.isSupervisor) {
      // Parse supervisor response for routing info
      const routingHtml = buildRoutingCard(reply, agent);
      agentSessions[agent.id].push({ role: 'assistant', content: reply, isRouting: true, routingHtml });
      addAudit('Supervisor synthesized multi-agent response', 'p');
    } else {
      agentSessions[agent.id].push({ role: 'assistant', content: reply });
      addAudit(`${agent.name} generated response`, 'g');
    }
  } else {
    agentSessions[agent.id].push({ role: 'assistant', content: 'I encountered an issue. Please check your API settings and try again.' });
  }

  if (btn) btn.disabled = false;
  renderMainArea();
  scrollChat();
}

// ═══════════════════════════════════════════════════════════
// SUPERVISOR ROUTING CARD
// ═══════════════════════════════════════════════════════════
function buildRoutingCard(reply, agent) {
  // Extract routing info from response
  const routingMatch = reply.match(/ROUTING:\s*(.+)/i);
  const confidenceMatch = reply.match(/CONFIDENCE:\s*(\d+)\/100/i);
  const routingAgents = routingMatch ? routingMatch[1].split(/[,→+]/).map(s=>s.trim()).filter(Boolean) : [agent.name];
  const confidence = confidenceMatch ? parseInt(confidenceMatch[1]) : 75;
  const confColor = confidence >= 80 ? 'var(--green)' : confidence >= 60 ? 'var(--amber)' : 'var(--red)';

  // Clean the response text
  const cleanReply = reply
    .replace(/ROUTING:.*\n?/i, '')
    .replace(/FLOW:.*\n?/i, '')
    .replace(/CONFIDENCE:.*\n?/i, '')
    .trim();

  const nodeHtml = routingAgents.map((a, i) =>
    `${i > 0 ? '<span class="routing-arrow">→</span>' : ''}<div class="routing-node done">${a}</div>`
  ).join('');

  return `<div class="routing-card">
    <div class="routing-card-head">
      <span class="routing-card-label">🧭 Supervisor · Orchestrated Response</span>
      <div style="display:flex;gap:5px">
        <button class="btn-sm" onclick="copyText(this)" data-text="${escAttr(cleanReply)}">📋 Copy</button>
      </div>
    </div>
    <div class="routing-flow">${nodeHtml}</div>
    <div class="confidence-bar">
      <span class="conf-label">CONFIDENCE</span>
      <div class="conf-track"><div class="conf-fill" style="width:${confidence}%;background:${confColor}"></div></div>
      <span class="conf-score" style="color:${confColor}">${confidence}/100</span>
    </div>
    <div class="output-card-body" style="padding:13px 15px;font-size:.75rem;line-height:1.8;white-space:pre-wrap">${escHtml(cleanReply)}</div>
  </div>`;
}

        </div>
        ${s.policiesFileName ? `<div class="file-pill"><span>📜 ${s.policiesFileName}</span><span style="cursor:pointer;color:var(--t3)" onclick="clearFile('${agent.id}','policies')">✕</span></div>` : ''}
        <textarea class="setting-textarea" id="pol-text-${agent.id}" placeholder="Or paste policy text here..." oninput="saveInlineText('${agent.id}','policies',this.value)">${s.policiesText||''}</textarea>
      </div>

      <div class="setting-group">
        <label class="setting-label">✍️ Example Outputs</label>

// ═══════════════════════════════════════════════════════════
// FILE UPLOAD HANDLERS
// ═══════════════════════════════════════════════════════════
function handleFileUpload(input, agentId, type) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if (!agentSettings[agentId]) agentSettings[agentId] = {};
    agentSettings[agentId][type + 'Text'] = e.target.result.substring(0, 6000);
    agentSettings[agentId][type + 'FileName'] = file.name;
    localStorage.setItem('mo_agent_settings', JSON.stringify(agentSettings));
    showToast(`✓ ${file.name} loaded for ${AGENTS.find(a=>a.id===agentId)?.name}`, 'success');
    renderSidebar();
    renderMainArea();
  };
  reader.readAsText(file);
}

function saveInlineText(agentId, type, value) {
  if (!agentSettings[agentId]) agentSettings[agentId] = {};
  agentSettings[agentId][type + (type === 'customInstructions' ? '' : 'Text')] = value;
  // Map field names correctly
  if (type === 'jd') agentSettings[agentId].jdText = value;
  if (type === 'policies') agentSettings[agentId].policiesText = value;
  localStorage.setItem('mo_agent_settings', JSON.stringify(agentSettings));
}

function clearFile(agentId, type) {
  if (!agentSettings[agentId]) return;
  delete agentSettings[agentId][type + 'Text'];
  delete agentSettings[agentId][type + 'FileName'];
  localStorage.setItem('mo_agent_settings', JSON.stringify(agentSettings));
  renderSidebar();
  renderMainArea();
}

function clearSession(agentId) {
  delete agentSessions[agentId];
  renderMainArea();
}

// ═══════════════════════════════════════════════════════════
// GLOBAL SETTINGS MODAL
// ═══════════════════════════════════════════════════════════
function openSettings(type, agentId) {
  if (type === 'agent' && agentId) {
    currentAgentId = agentId;
    currentView = 'settings';
    renderSidebar();
    renderMainArea();
    return;
  }
  // Global settings modal
  const overlay = document.getElementById('settings-overlay');
  const content = document.getElementById('settings-content');
  const p = globalSettings.provider || 'claude';
  const prov = PROVIDERS[p];

  content.innerHTML = `
    <div style="font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--t1);margin-bottom:4px">⚙️ Global Settings</div>
    <div style="font-size:.72rem;color:var(--t3);margin-bottom:20px">Configure your AI provider. Works with Claude, GPT, Gemini, and Azure Copilot.</div>

    <div class="settings-section">
      <h3>🔌 API Provider</h3>
      <div class="provider-grid">
        ${Object.entries(PROVIDERS).map(([key, pv]) => `
          <div class="provider-card ${globalSettings.provider===key?'active':''}" onclick="selectProvider('${key}')">
            <div class="provider-icon">${pv.icon}</div>
            <div class="provider-name">${pv.name}</div>
            <div class="provider-model">${pv.defaultModel}</div>
          </div>`).join('')}
      </div>

      <div class="setting-group">
        <label class="setting-label">API Key</label>
        <input class="setting-input" type="password" id="gs-apikey" value="${globalSettings.apiKey||''}" placeholder="${PROVIDERS[p]?.placeholder||'Enter API key'}">
      </div>

      <div class="setting-group">
        <label class="setting-label">Model</label>
        <select class="setting-select" id="gs-model">
          ${(PROVIDERS[p]?.models||[]).map(m=>`<option value="${m}" ${globalSettings.model===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>

      ${p === 'azure' ? `
      <div class="setting-group">
        <label class="setting-label">Azure Endpoint</label>
        <input class="setting-input" id="gs-endpoint" value="${globalSettings.azureEndpoint||''}" placeholder="https://your-resource.openai.azure.com">
      </div>
      <div class="setting-group">
        <label class="setting-label">Azure Deployment Name</label>
        <input class="setting-input" id="gs-deployment" value="${globalSettings.azureDeployment||''}" placeholder="gpt-4o">
      </div>` : ''}
    </div>

    <div class="settings-section">
      <h3>📡 Audit Trail</h3>
      <div class="audit-trail" id="audit-trail-display">
        ${auditLog.length === 0 ? '<div style="color:var(--t3);font-size:.7rem">No activity yet</div>' :
          auditLog.slice().reverse().map(e=>`
            <div class="audit-entry">
              <div class="audit-dot ${e.type}"></div>
              <div class="audit-text">${e.msg}</div>
              <div class="audit-time">${e.time}</div>
            </div>`).join('')}
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button style="background:linear-gradient(135deg,var(--gold),#a07830);border:none;border-radius:8px;padding:9px 20px;font-family:inherit;font-size:.78rem;font-weight:700;color:#080c12;cursor:pointer" onclick="saveGlobalSettings()">✓ Save Settings</button>
      <button style="background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:9px 16px;font-family:inherit;font-size:.78rem;color:var(--t2);cursor:pointer" onclick="testConnection()">🔌 Test Connection</button>
      <button style="background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:9px 16px;font-family:inherit;font-size:.78rem;color:var(--t2);cursor:pointer" onclick="closeSettings()">Close</button>
    </div>
    <div class="test-result" id="test-result"></div>
  `;
  overlay.style.display = 'flex';
}

function selectProvider(key) {
  globalSettings.provider = key;
  globalSettings.model = PROVIDERS[key].defaultModel;
  openSettings('global');
}

function saveGlobalSettings() {
  globalSettings.apiKey = document.getElementById('gs-apikey')?.value || '';
  globalSettings.model = document.getElementById('gs-model')?.value || '';
  if (globalSettings.provider === 'azure') {
    globalSettings.azureEndpoint = document.getElementById('gs-endpoint')?.value || '';
    globalSettings.azureDeployment = document.getElementById('gs-deployment')?.value || '';
  }
  localStorage.setItem('mo_global_settings', JSON.stringify(globalSettings));
  updateAPIIndicator();
  showToast('✓ Settings saved', 'success');
  closeSettings();
}

async function testConnection() {
  const apiKey = document.getElementById('gs-apikey')?.value;
  const model = document.getElementById('gs-model')?.value;
  if (!apiKey) { showToast('Enter an API key first', 'warning'); return; }
  const tempSettings = {...globalSettings, apiKey, model};
  const savedSettings = globalSettings;
  globalSettings = tempSettings;
  const result = document.getElementById('test-result');
  if (result) { result.style.display = 'block'; result.className = 'test-result'; result.textContent = 'Testing connection...'; }
  const reply = await callAI('Say "Connection successful" and nothing else.', 'You are a connection test. Reply only with: Connection successful.', []);
  globalSettings = savedSettings;
  if (result) {
    if (reply && reply.toLowerCase().includes('success')) {
      result.className = 'test-result success';
      result.textContent = '✓ Connection successful — API is working';
    } else {
      result.className = 'test-result error';
      result.textContent = '✗ Connection failed — check your API key and settings';
    }
  }
}

function closeSettings() {
  document.getElementById('settings-overlay').style.display = 'none';
}

function updateAPIIndicator() {
  const dot = document.getElementById('api-dot');
  const label = document.getElementById('api-label');
  if (!globalSettings.apiKey) {
    dot.className = 'api-dot warn';
    label.textContent = 'No API configured';
  } else {
    dot.className = 'api-dot';
    const prov = PROVIDERS[globalSettings.provider];
    label.textContent = `${prov?.icon || ''} ${prov?.name || globalSettings.provider} · ${globalSettings.model}`;
  }
}

// ═══════════════════════════════════════════════════════════
// THINKING INDICATOR
// ═══════════════════════════════════════════════════════════
function addThinking(agent) {
  const chat = document.getElementById('chat-area');
  if (!chat) return;
  const div = document.createElement('div');
  div.id = 'thinking-indicator';
  div.className = 'thinking';
  div.innerHTML = `
    <div class="msg-av" style="background:${agent.bg};border:1px solid ${agent.border};color:${agent.color};width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-family:'DM Mono',monospace;flex-shrink:0">${agent.abbr}</div>
    <div class="thinking-bubble">
      <span style="font-size:.7rem">${agent.isSupervisor ? 'Routing to agents' : agent.name + ' is thinking'}</span>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function removeThinking() {
  document.getElementById('thinking-indicator')?.remove();
}

// ═══════════════════════════════════════════════════════════
// AUDIT
// ═══════════════════════════════════════════════════════════
function addAudit(msg, type = 'b') {
  auditLog.push({
    msg, type,
    time: new Date().toLocaleTimeString('en-CA', {hour:'2-digit', minute:'2-digit'})
  });
  if (auditLog.length > 50) auditLog.shift();
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function scrollChat() {
  const chat = document.getElementById('chat-area');
  if (chat) setTimeout(() => chat.scrollTop = chat.scrollHeight, 50);
}

function escHtml(t) {
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(t) {
  return (t||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;').substring(0, 2000);
}

function copyText(btn) {
  const text = btn.dataset.text;
  navigator.clipboard.writeText(text);
  btn.textContent = '✓ Copied';
  setTimeout(() => btn.textContent = '📋 Copy', 2000);
}

function showToast(msg, type='info') {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
renderSidebar();
renderMainArea();
updateAPIIndicator();
addAudit('Agents Hub initialized', 'g');
</script>
